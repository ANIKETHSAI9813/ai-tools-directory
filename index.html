<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tools Directory</title>
<meta name="description" content="A searchable list of AI and developer tools, collected daily from Hacker News, Product Hunt, GitHub and Hugging Face.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>AI Tools Directory</h1>
        <p class="sub">New tools from Hacker News, Product Hunt, GitHub and Hugging Face, collected daily. <span id="count"></span></p>
      </div>
      <a class="submit" href="https://docs.google.com/forms/d/e/1FAIpQLSfrPhHJ8zSm2bU8mAwu8BIL1_KILEQBU2WywI3sP7SemrOt1A/viewform" target="_blank" rel="noopener">Submit a tool</a>
    </header>

    <div class="controls">
      <label class="visually-hidden" for="q">Search</label>
      <input id="q" type="search" placeholder="Search tools — e.g. “video agent”, “pdf”, “open source”" autocomplete="off" spellcheck="false">
      <div class="row">
        <label class="visually-hidden" for="cat">Category</label>
        <select id="cat"></select>
        <button id="saved" type="button" aria-pressed="false">Saved <span id="savedCount"></span></button>
      </div>
    </div>

    <nav class="tabs" id="tabs" aria-label="Sort tools">
      <button type="button" data-sort="popular" aria-current="true">Most popular</button>
      <button type="button" data-sort="new">Recently added</button>
      <button type="button" data-sort="az">A–Z</button>
    </nav>

    <p id="status" class="status" aria-live="polite">Loading…</p>
    <ul id="list" class="list"></ul>
    <button id="more" class="more" type="button" hidden>Show more</button>

    <footer class="foot">
      Sources: <a href="https://news.ycombinator.com/show">Show HN</a>,
      <a href="https://www.producthunt.com/">Product Hunt</a>,
      <a href="https://github.com/">GitHub</a>,
      <a href="https://huggingface.co/spaces">Hugging Face Spaces</a>.
      Dead links are removed automatically.
      <a href="https://github.com/anikethsai9813/ai-tools-directory">Source code</a>
    </footer>
  </div>

  <template id="item">
    <li class="item">
      <div class="main">
        <a class="name" target="_blank" rel="noopener"></a>
        <p class="desc"></p>
        <p class="meta"></p>
      </div>
      <button class="save" type="button" aria-pressed="false" aria-label="Save">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      </button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
